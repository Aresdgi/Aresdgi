name: Serpiente de contribuciones

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar las animaciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#A86100&color_dots=#DDE7E8,#B7D3D4,#7FB3B8,#3F8C91,#1F5E63
            dist/snake-dark.svg?color_snake=#F2B33D&color_dots=#11273A,#16405A,#1F6280,#3E8FA8,#8FD0C2

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
